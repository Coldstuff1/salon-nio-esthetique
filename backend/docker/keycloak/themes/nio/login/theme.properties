# Salon Nio Esthétique login theme. Extends Keycloak's unstyled base templates; template.ftl and
# login.ftl are overridden, every other page keeps the base markup and is styled through the
# class hooks below.
parent=base
import=common/keycloak

styles=css/nio.css
locales=fr,en
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=nio
kcBodyClass=nio-body

kcFormGroupClass=nio-group
kcFormSettingClass=nio-settings
kcFormOptionsClass=nio-options
kcFormOptionsWrapperClass=nio-options-wrapper
kcFormButtonsClass=nio-buttons
kcFormButtonsWrapperClass=nio-buttons-wrapper
kcContentWrapperClass=nio-row
kcLabelWrapperClass=nio-label-wrapper
kcInputWrapperClass=nio-input-wrapper
kcInputGroup=nio-input-group
kcMarginTopClass=nio-mt

kcLabelClass=nio-label
kcInputClass=nio-input
kcTextareaClass=nio-input
kcInputErrorMessageClass=nio-field-error
kcInputHelperTextBeforeClass=nio-helper
kcInputHelperTextAfterClass=nio-helper
kcCheckInputClass=nio-check
kcCheckboxInputClass=nio-check
kcInputClassCheckbox=nio-choice
kcInputClassCheckboxInput=nio-check
kcInputClassCheckboxLabel=nio-choice-label
kcInputClassRadio=nio-choice
kcInputClassRadioInput=nio-check
kcInputClassRadioLabel=nio-choice-label
kcInputClassRadioCheckboxLabelDisabled=nio-choice-disabled

kcFormPasswordVisibilityButtonClass=nio-reveal
kcFormPasswordVisibilityIconShow=nio-icon-eye
kcFormPasswordVisibilityIconHide=nio-icon-eye-off

kcButtonClass=nio-btn
kcButtonPrimaryClass=nio-btn-primary
kcButtonSecondaryClass=nio-btn-outline
