spring:
  application:
    name: backend
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  docker:
    compose:
      lifecycle-management: start-only
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/nio
          jwk-set-uri: http://localhost:8180/realms/nio/protocol/openid-connect/certs
          # only tokens Keycloak minted for this API (see the nio-backend-audience client scope)
          audiences: nio-backend

# health checks only, on a port that is never published
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    oauth:
      client-id: nio-swagger
      scopes: openid
      use-pkce-with-authorization-code-grant: true
    persist-authorization: true

salon:
  zone: America/Montreal
  slot-step-minutes: 15
  media:
    endpoint: http://localhost:8333
    public-endpoint: http://localhost:8333
    bucket: nio-media
    access-key: nio-dev
    secret-key: nio-dev-secret
    create-bucket: true
    allowed-origins: http://localhost:5173
