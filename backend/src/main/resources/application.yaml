spring:
  application:
    name: backend
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  session:
    jdbc:
      initialize-schema: always
  docker:
    compose:
      lifecycle-management: start-only
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/nio
          jwk-set-uri: http://localhost:8180/realms/nio/protocol/openid-connect/certs

salon:
  zone: America/Toronto
  slot-step-minutes: 15
