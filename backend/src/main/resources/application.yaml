spring:
  application:
    name: backend
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      # listeners (e.g. notifications) that didn't finish before a crash or shutdown run again on startup
      republish-outstanding-events-on-restart: true
      # finished publications are deleted instead of piling up in event_publication
      completion-mode: delete
  docker:
    compose:
      lifecycle-management: start-only
  # notification emails land in Mailpit (http://localhost:8025)
  mail:
    host: localhost
    port: 1025
  messages:
    # English (messages.properties) for 'en', not whatever language this machine runs in
    fallback-to-system-locale: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/nio
          jwk-set-uri: http://localhost:8180/realms/nio/protocol/openid-connect/certs
          # only tokens Keycloak minted for this API (see the nio-backend-audience client scope)
          audiences: nio-backend

# health checks only, on a port that is never published
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Boot would log in to the SMTP server on every check: a slow or failing mail provider would mark the backend
    # unhealthy and keep the site down. Failed emails are retried by the DeliveryDispatcher instead.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    oauth:
      client-id: nio-swagger
      scopes: openid
      use-pkce-with-authorization-code-grant: true
    persist-authorization: true

