spring:
  application:
    name: backend
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  session:
    jdbc:
      initialize-schema: always
  docker:
    compose:
      lifecycle-management: start-only
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/nio
          jwk-set-uri: http://localhost:8180/realms/nio/protocol/openid-connect/certs

springdoc:
  swagger-ui:
    oauth:
      client-id: nio-swagger
      scopes: openid
      use-pkce-with-authorization-code-grant: true
    persist-authorization: true

salon:
  zone: America/Montreal
  slot-step-minutes: 15
