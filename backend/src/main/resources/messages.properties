notification.STAFF_BOOKING_OPEN.title=Appointment to close
notification.STAFF_BOOKING_OPEN.body={0}’s appointment on {1} at {2} is still open. Mark it as completed or as a no-show.
notification.STAFF_BOOKING_OPEN.action=Open my schedule

# {0} number of appointments, {1} time of the first one
notification.STAFF_DAILY_AGENDA.title=Your day
