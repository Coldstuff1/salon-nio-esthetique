# Text the backend sends itself (notification emails), in English; French is in messages_fr.properties.
# Arguments are numbered ({0}); write apostrophes as ’, since a plain ' is special in messages with arguments.
# The site's in-app list has its own copy of this text (frontend/src/i18n): keep them saying the same thing.

email.brand=Salon Nio Esthétique
email.greeting=Hello {0},
email.footer=This message was sent automatically by Salon Nio Esthétique. Please don’t reply to it.
email.unsubscribe=Stop these emails
email.settings=Manage my notifications

# {0} employee, {1} date, {2} time
notification.BOOKING_CONFIRMED.title=Appointment confirmed
notification.BOOKING_CONFIRMED.body=Your appointment with {0} on {1} at {2} is confirmed. See you soon!
notification.BOOKING_CONFIRMED.action=View my appointment
notification.BOOKING_CANCELLED.title=Appointment cancelled
notification.BOOKING_CANCELLED.body=The salon cancelled your appointment with {0} on {1} at {2}. You can book another time on the site.
notification.BOOKING_CANCELLED.action=View my appointment
notification.BOOKING_REMINDER.title=Appointment reminder
notification.BOOKING_REMINDER.body=Your appointment with {0} is on {1} at {2}. Can’t make it? You can cancel it on the site.
notification.BOOKING_REMINDER.action=View my appointment

# {0} client, {1} date, {2} time
notification.STAFF_BOOKING_CREATED.title=New appointment
