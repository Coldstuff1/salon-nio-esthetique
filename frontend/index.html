<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Salon Nio Esthétique — soins du visage, épilation à la cire et sourcils.">
    <meta name="theme-color" content="#FBF4F0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1E191B" media="(prefers-color-scheme: dark)">
    <title>Salon Nio Esthétique</title>
    <script>
      // set the theme before first paint so dark mode doesn't flash; mirrors src/composables/useTheme.ts
      (function () {
        var theme
        try { theme = localStorage.getItem('nio.theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
