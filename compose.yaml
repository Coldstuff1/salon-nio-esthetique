include:
  - backend/compose.yaml

services:
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '5173:80'
