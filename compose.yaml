# The whole stack for local development (docker compose up --build). Production: compose.prod.yaml.
include:
  - backend/compose.yaml

services:
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/nio
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/nio/protocol/openid-connect/certs
      SALON_MEDIA_ENDPOINT: http://s3:8333
      SALON_MEDIA_PUBLIC_ENDPOINT: http://localhost:8333
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: http://localhost:8180
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - '127.0.0.1:5173:8080'
