# Tests, dependency audit and image scans on every push and pull request. On main, the scanned images are pushed
# to GHCR and, once approved in the production environment, deployed (docs/operations.md, "Continuous
# deployment"). Actions are pinned to commits; Dependabot (.github/dependabot.yml) proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NIO_SITE_DOMAIN: salon-nio.ca
  NIO_AUTH_DOMAIN: auth.salon-nio.ca

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # a tampered gradle-wrapper.jar would run arbitrary code in the build
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test (Testcontainers runs Postgres and SeaweedFS)
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Committed OpenAPI spec matches the controllers
        run: git diff --exit-code frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check and build
        run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          - name: keycloak
            context: backend/docker/keycloak
    env:
      # lower case, as GHCR requires; the names compose.prod.yaml pulls
      IMAGE: ghcr.io/coldstuff1/nio-${{ matrix.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the frontend bakes the production Keycloak URL and its version into its bundle; the other images ignore
      # the arguments
      - name: Build
        run: |
          docker build --build-arg VITE_KEYCLOAK_URL="https://$NIO_AUTH_DOMAIN" \
              --build-arg VITE_APP_VERSION="${GITHUB_SHA::7}" -t "$IMAGE" ${{ matrix.context }}
      - name: Scan for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # waits for a reviewer's approval; the SSH key and host key are secrets of this environment
    environment:
      name: production
      url: https://${{ env.NIO_SITE_DOMAIN }}
    # one deploy at a time; of several waiting for approval, only the newest is kept
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH (the key can only run deploy/deploy.sh)
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ vars.PROD_SSH_USER }}@${{ vars.PROD_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_TARGET" "$GITHUB_SHA"
      - name: The site and the sign-in answer from outside
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --output /dev/null \
              "https://$NIO_SITE_DOMAIN/"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --output /dev/null \
              "https://$NIO_AUTH_DOMAIN/realms/nio/.well-known/openid-configuration"
